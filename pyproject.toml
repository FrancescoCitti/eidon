[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidon"
version = "0.1.0"
description = "Production-grade real-time facial recognition pipeline using ArcFace and RetinaFace"
requires-python = ">=3.11"
dependencies = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx2>=0.28",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
eidon-download = "scripts.download_models:main"
eidon-enroll   = "scripts.enroll:main"
eidon-webcam   = "scripts.webcam:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "B008",   # FastAPI: Depends/File/Form in default args is the standard pattern
    "N806",   # allow uppercase names in math/linear-algebra functions (U, R, M, Vt)
]

[tool.ruff.lint.per-file-ignores]
# Tests and scripts don't need full annotation coverage
"tests/**"   = ["ANN"]
"scripts/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["eidon"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["insightface.*", "cv2.*", "sklearn.*", "onnxruntime.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
