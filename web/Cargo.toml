[package]
name = "eidon-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "eidon-web"
path = "src/main.rs"

[dependencies]
# UI framework — signal-based reactive WASM frontend
leptos = { version = "0.6", features = ["csr"] }

# Web APIs
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  # Window / document
  "Window", "Document", "Element", "HtmlElement", "Node",
  "DomTokenList", "CssStyleDeclaration",
  # Media
  "MediaDevices", "MediaStream", "MediaStreamConstraints",
  "MediaStreamTrack", "MediaTrackConstraints",
  "Navigator",
  # Canvas / video
  "HtmlVideoElement", "HtmlCanvasElement", "HtmlImageElement", "HtmlInputElement",
  "CanvasRenderingContext2d", "ImageData",
  # Files / object URLs
  "FileList", "File", "Blob", "Url",
  # Performance
  "Performance",
  # Canvas text measurement
  "TextMetrics",
  # Console
  "console",
] }

# IndexedDB (typed, async)
rexie = "0.5"

# HTTP fetch for model loading
gloo-net = { version = "0.5", features = ["http"] }

# Async helpers
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["std"] }

# Error handling
thiserror = "1"

# Serialization (for IndexedDB records)
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimise binary size for WASM distribution
opt-level = "z"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1  # Faster incremental builds; WASM is large with opt-level=0
