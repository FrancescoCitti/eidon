<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eidon Face Recognition</title>
  <meta name="description"
        content="Real-time face recognition that runs entirely in your browser.
                 No server, no cloud, no data leaves your device." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap"
        rel="stylesheet" />

  <!-- onnxruntime-web: loaded before the WASM module so globalThis.ort is available -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>

  <!-- Trunk injects the compiled WASM + JS glue here -->
  <link data-trunk rel="rust" data-bin="eidon-web" data-wasm-opt="z" />

  <!-- Copy the styles and public assets into dist/ -->
  <link data-trunk rel="css" href="src/styles.css" />
  <link data-trunk rel="copy-dir" href="public/models" />
</head>
<body>
  <div id="app"></div>
</body>
</html>
